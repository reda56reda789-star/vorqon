# VORQON — Railway front door TEMPLATE (see Dockerfile.railway).
#
# Same job as deploy/hf/nginx.conf — serve the built SPA from
# /app/frontend-dist and proxy /api/ to the backend — with ONE
# difference: the two ports are placeholders. Railway injects its own
# PORT environment variable at runtime and routes public traffic to
# exactly that port, so the listen port cannot be baked into the image
# the way the HF config bakes in 7860.
#
# deploy/railway/start-railway.sh renders this template with sed into
# /etc/nginx/nginx.conf on every container start:
#   __NGINX_PORT__    <- Railway's injected $PORT (fallback: 7860,
#                        the HF behaviour, when PORT is absent)
#   __BACKEND_PORT__  <- 3000 (the backend is always internal)
# The template itself is never modified, so restarts re-render cleanly.
#
# This file is a complete main config (it REPLACES /etc/nginx/nginx.conf
# after rendering). Paths are /tmp-based and no `user` directive is set,
# same as the HF config, so it also works as a non-root user.

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # Temp paths must be writable by whatever user runs the container.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen __NGINX_PORT__;
        server_name _;

        root /app/frontend-dist;
        index index.html;

        # API → backend. The backend's own routes already begin with
        # /api, so the request path is passed through unchanged
        # (no trailing slash on proxy_pass).
        location /api/ {
            proxy_pass http://127.0.0.1:__BACKEND_PORT__;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # SPA: serve the real file when it exists (JS/CSS/assets),
        # index.html for everything else so React Router links work.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
