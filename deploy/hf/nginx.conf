# VORQON — Hugging Face Space front door (see deploy/hf/Dockerfile.space).
# nginx is the only process HF routes traffic to (port 7860): it serves
# the built SPA from /app/frontend-dist and proxies /api/ to the backend
# on 127.0.0.1:3000 (both processes are started by deploy/hf/start.sh).
#
# This file REPLACES /etc/nginx/nginx.conf inside the Space image, so it
# is a complete main config. Paths are /tmp-based and no `user` directive
# is set, because the Space container may run as a non-root user (1000).

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # Temp paths must be writable by whatever user runs the container.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 7860;
        server_name _;

        root /app/frontend-dist;
        index index.html;

        # API → backend. The backend's own routes already begin with
        # /api, so the request path is passed through unchanged
        # (no trailing slash on proxy_pass).
        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # SPA: serve the real file when it exists (JS/CSS/assets),
        # index.html for everything else so React Router links work.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
